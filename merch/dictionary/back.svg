<?xml version="1.0" encoding="UTF-8"?>
<!-- Back print, dark shirt. 30 x 28 cm (canvas cropped to the content; the logo stamp goes on the front). Edit here, then run merch/dictionary/export.sh for the print files. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="300mm" height="280mm" viewBox="0 100 1200 1120">
  <style>
    .kanji { font-family: 'Yu Mincho', 'MS Mincho', serif; font-weight: 600; fill: #d4000c; }
    .word  { font-family: Georgia, 'Times New Roman', serif; fill: #f2f2f2; }
    .pron  { font-family: Georgia, 'Times New Roman', serif; fill: #4bb8c9; }
    .pos   { font-family: Georgia, 'Times New Roman', serif; font-style: italic; fill: #9a9aa6; }
    .def   { font-family: Georgia, 'Yu Mincho', serif; fill: #d8d8de; }
  </style>

  <!-- Headword as a company seal (角印): 2 x 2 grid, read right column first, top to bottom.
       the seal is traced from shared/gemini/seal-stamp.png: red ink only, gaps are holes. -->
  <image href="../shared/stamps/stamp-seal.svg" x="120" y="140" width="300" height="300" />

  <!-- Romaji / pronunciation + part of speech -->
  <text class="word"  x="120" y="600" font-size="130">MadGear<tspan style="font-family: 'Yu Mincho', 'MS Mincho', serif">ＦＦＭ</tspan></text>
  <text class="pron"  x="120" y="680" font-size="46">/ma-do-gi-a e-fu e-fu e-mu/ <tspan class="pos">noun</tspan></text>

  <!-- Numbered facts: number at x=120, text hangs at x=175 -->
  <text class="def" font-size="42">
    <tspan class="pron" x="120" y="800">1.</tspan><tspan x="175" y="800">Frankfurt’s home for fighting game locals.</tspan>
    <tspan x="175" y="860">Since 2018.</tspan>
    <tspan class="pron" x="120" y="940">2.</tspan><tspan x="175" y="940">FFM stands for Frankfurt am Main.</tspan>
    <tspan class="pron" x="120" y="1020">3.</tspan><tspan x="175" y="1020">魔demon, 奴rough guy, 義honour and 亜Asia</tspan>
    <tspan x="175" y="1080">(mostly there for the sound).</tspan>
    <tspan class="pron" x="120" y="1160">4.</tspan><tspan x="175" y="1160">Real people. Real cabs. Real matches.</tspan>
  </text>

</svg>
