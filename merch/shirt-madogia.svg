<?xml version="1.0" encoding="UTF-8"?>
<!-- Back print, dark shirt. 30 x 40 cm. Edit here, then run merch/export.sh for the print files. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="300mm" height="400mm" viewBox="0 0 1200 1600">
  <style>
    .kanji { font-family: 'Yu Gothic', 'MS Gothic', sans-serif; font-weight: 700; fill: #d4000c; }
    .head  { font-family: Impact, 'Anton', sans-serif; fill: #f2f2f2; }
    .read  { font-family: Impact, 'Anton', sans-serif; fill: #4bb8c9; }
    .mean  { font-family: Impact, 'Anton', sans-serif; fill: #f2f2f2; }
    .note  { font-family: 'Bahnschrift', 'Inter', sans-serif; fill: #9a9aa6; }
    .rule  { stroke: #f2f2f2; stroke-width: 4; }
    .slot  { fill: none; stroke: #9a9aa6; stroke-width: 3; stroke-dasharray: 6 6; }
    .thin  { stroke: #4bb8c9; stroke-width: 2; stroke-dasharray: 10 8; }
  </style>

  <!-- Header -->
  <image href="../public/logo-text.svg" x="370" y="22" width="460" height="217" />
  <text class="kanji" x="600" y="345" font-size="96" text-anchor="middle" letter-spacing="24">魔奴義亜</text>
  <text class="read" x="600" y="410" font-size="44" text-anchor="middle" letter-spacing="14">[MA-DO-GI-A]</text>
  <line class="rule" x1="120" y1="455" x2="1080" y2="455" />

  <!-- Dictionary rows: kanji | [reading] | meaning -->
  <g>
    <text class="kanji" x="150" y="635" font-size="170">魔</text>
    <text class="read"  x="400" y="560" font-size="60">[MA]</text>
    <text class="mean"  x="400" y="640" font-size="72">DEMON</text>
    <line class="thin" x1="120" y1="690" x2="1080" y2="690" />

    <text class="kanji" x="150" y="870" font-size="170">奴</text>
    <text class="read"  x="400" y="795" font-size="60">[DO]</text>
    <text class="mean"  x="400" y="875" font-size="72">ROUGH GUY</text>
    <line class="thin" x1="120" y1="925" x2="1080" y2="925" />

    <text class="kanji" x="150" y="1105" font-size="170">義</text>
    <text class="read"  x="400" y="1030" font-size="60">[GI]</text>
    <text class="mean"  x="400" y="1110" font-size="72">HONOUR</text>
    <line class="thin" x1="120" y1="1160" x2="1080" y2="1160" />

    <text class="kanji" x="150" y="1340" font-size="170">亜</text>
    <text class="read"  x="400" y="1265" font-size="60">[A]</text>
    <text class="mean"  x="400" y="1345" font-size="72">ASIA</text>
    <text class="note"  x="400" y="1385" font-size="30">(mostly here for the sound)</text>
  </g>

  <!-- Caricature slots (placeholders, swap for <image> later) -->
  <!-- Mockups: demon.jpg / guy.jpg with the black knocked out (*-cut.png) -->
  <image href="demon-cut.png" x="870" y="472" width="180" height="205" />
  <image href="guy-cut.png" x="874" y="704" width="173" height="210" />
  <image href="../public/logo-mark.svg" x="860" y="943" width="200" height="202" />

  <!-- Footer -->
  <line class="rule" x1="120" y1="1430" x2="1080" y2="1430" />
  <text class="head" x="600" y="1510" font-size="64" text-anchor="middle" letter-spacing="6">FRANKFURT · RHEIN-MAIN</text>
  <text class="note" x="600" y="1560" font-size="30" text-anchor="middle" letter-spacing="8">FIGHTING GAME LOCALS</text>
</svg>
