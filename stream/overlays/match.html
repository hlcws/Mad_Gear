<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MadGear · Match</title>
<link rel="stylesheet" href="common.css">
<style>
  /* Holes (transparent): game 0,0 1600x900 · cam 1600,0 320x180 */
  .cam-frame { left: 1600px; top: 0; width: 320px; height: 180px; box-shadow: inset 0 0 0 3px var(--red); }
  .side { left: 1600px; top: 180px; width: 320px; height: 720px; border-left: 3px solid var(--red); }
  .bar { left: 0; top: 900px; width: 1920px; height: 180px; border-top: 4px solid var(--red); }

  .club { left: 32px; top: 924px; height: 132px; display: flex; align-items: center; gap: 22px; }
  .club img { height: 128px; }
  .club .nm { font-size: 58px; }
  .club .kanji { color: var(--teal); font-weight: 600; letter-spacing: .4em; font-size: 18px; margin-top: 10px; }
  .club .session { height: 24px; margin-top: 6px; } /* session.html sits here (180,1027 340x24) */

  .tab { left: 960px; top: 918px; transform: translateX(-50%); padding: 4px 18px; font-size: 22px; color: var(--teal); letter-spacing: .12em; }
  .board { left: 960px; top: 954px; transform: translateX(-50%); display: grid; grid-template-columns: 290px 96px 88px 96px 290px; height: 96px; }
  .board .name.r { justify-content: flex-end; }
  .board .ft { display: grid; place-items: center; font-size: 30px; background: var(--bg); color: var(--muted); }

  .bar-socials { right: 34px; top: 948px; }
</style>
</head>
<body>
  <div class="abs cam-frame"></div>
  <div class="abs side panel"><div class="chat-head" data-icon="twitch"><span>Chat</span></div></div>

  <div class="abs bar panel"></div>
  <div class="abs club">
    <img src="assets/logo-mark.svg" alt="">
    <div>
      <div class="nm display" data-config="club"></div>
      <div class="kanji" data-config="kanji"></div>
      <div class="session"></div>
    </div>
  </div>

  <div class="abs tab display live" data-bind="title"></div>
  <div class="abs board live">
    <div class="name" data-side="1" data-bind="p1"></div>
    <div class="score" data-side="1" data-bind="s1"></div>
    <div class="ft display" data-bind="ft"></div>
    <div class="score" data-side="2" data-bind="s2"></div>
    <div class="name r" data-side="2" data-bind="p2"></div>
  </div>

  <div class="abs bar-socials socials" data-socials></div>

  <script type="module">import { start } from './common.js'; start();</script>
</body>
</html>
