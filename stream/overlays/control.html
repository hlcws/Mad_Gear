<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MadGear Control</title>
<style>
  :root { --bg: #0b0b0d; --surface: #15151d; --surface-2: #1d1d27; --border: #2a2a36; --text: #f3f1ec; --muted: #a3a1b0; --red: #d4000c; --teal: #4bb8c9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 'Segoe UI', system-ui, sans-serif; padding: 16px; }
  h1 { font: 400 22px Impact, 'Anton', sans-serif; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 14px; }
  h1 span { color: var(--red); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 22px 0 8px; }
  .score { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; }
  .player { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
  .num { font: 400 64px/1 Impact, 'Anton', sans-serif; text-align: center; }
  .player.win .num { color: var(--teal); }
  .btns { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
  .mid { display: grid; gap: 8px; justify-items: center; padding-top: 12px; }
  .mid .ft { font: 400 26px Impact, sans-serif; color: var(--muted); }
  button { font: inherit; font-weight: 700; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; cursor: pointer; }
  button:active { transform: translateY(1px); }
  button.plus { background: var(--red); border-color: var(--red); font-size: 22px; }
  button.minus { font-size: 22px; }
  input { width: 100%; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; }
  input:focus { outline: 2px solid var(--teal); border-color: transparent; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .urls { display: grid; gap: 4px; font: 13px Consolas, monospace; }
  .urls div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 8px; background: var(--surface); border-radius: 6px; cursor: pointer; }
  .urls span:first-child { color: var(--muted); font-family: 'Segoe UI', sans-serif; }
  .urls div:hover { outline: 1px solid var(--teal); }
  .status { font-size: 12px; color: var(--muted); }
  .status.off { color: var(--red); }
  @media (max-width: 520px) { .score { grid-template-columns: 1fr 1fr; } .mid { grid-column: 1 / -1; order: 3; grid-auto-flow: column; padding: 0; } }
</style>
</head>
<body>
  <h1>Mad<span>Gear</span> Control <span class="status" id="status">connecting…</span></h1>

  <div class="score">
    <div class="player" id="p1box">
      <input id="p1" placeholder="Player 1">
      <div class="num" id="s1">0</div>
      <div class="btns"><button class="minus" data-act="p1/minus">−</button><button class="plus" data-act="p1/plus">+1</button></div>
    </div>
    <div class="mid">
      <div class="ft" id="ft">FT10</div>
      <div class="row"><button data-act="ft/minus">FT −</button><button data-act="ft/plus">FT +</button></div>
      <button data-act="swap">⇄ Swap</button>
      <button data-act="reset">Reset score</button>
    </div>
    <div class="player" id="p2box">
      <input id="p2" placeholder="Player 2">
      <div class="num" id="s2">0</div>
      <div class="btns"><button class="minus" data-act="p2/minus">−</button><button class="plus" data-act="p2/plus">+1</button></div>
    </div>
  </div>

  <h2>Set</h2>
  <div class="grid">
    <label>Set title (Casuals, Money Match, Top 8…)<input id="title"></label>
  </div>

  <h2>Deck hotkeys</h2>
  <div class="urls">
    <div><span>P1 +1 / −1</span><span>Ctrl+Alt+Shift+1 / 2</span></div>
    <div><span>P2 +1 / −1</span><span>Ctrl+Alt+Shift+3 / 4</span></div>
    <div><span>Reset / Swap</span><span>Ctrl+Alt+Shift+5 / 6</span></div>
    <div><span>Scenes: Starting, Match, Fullscreen, Break, Ending</span><span>Ctrl+Alt+Shift+F1 … F5</span></div>
  </div>

  <h2>Web request URLs (click to copy)</h2>
  <div class="urls" id="urls"></div>

<script>
  const fields = ['p1', 'p2', 'title'];
  const api = (path) => fetch('/api/' + path).then((r) => r.json());

  document.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => api(b.dataset.act));

  // Text fields: save while typing (debounced), don't overwrite the field you're editing
  let timer;
  for (const f of fields) {
    document.getElementById(f).addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const q = new URLSearchParams(fields.map((k) => [k, document.getElementById(k).value]));
        api('set?' + q);
      }, 300);
    });
  }

  const status = document.getElementById('status');
  const es = new EventSource('/api/events');
  es.onopen = () => { status.textContent = '● live'; status.className = 'status'; };
  es.onerror = () => { status.textContent = '● server offline'; status.className = 'status off'; };
  es.onmessage = (e) => {
    const s = JSON.parse(e.data);
    for (const f of fields) {
      const el = document.getElementById(f);
      if (document.activeElement !== el) el.value = s[f];
    }
    s1.textContent = s.s1; s2.textContent = s.s2; ft.textContent = 'FT' + s.ft;
    p1box.classList.toggle('win', s.s1 >= s.ft);
    p2box.classList.toggle('win', s.s2 >= s.ft);
  };

  const base = location.origin + '/api/';
  const list = [
    ['P1 +1', 'p1/plus'], ['P1 −1', 'p1/minus'], ['P2 +1', 'p2/plus'], ['P2 −1', 'p2/minus'],
    ['Reset score', 'reset'], ['Swap sides', 'swap'], ['FT +1', 'ft/plus'], ['FT −1', 'ft/minus'],
  ];
  urls.innerHTML = list.map(([n, p]) => `<div data-url="${base + p}"><span>${n}</span><span>${base + p}</span></div>`).join('');
  urls.onclick = (e) => {
    const row = e.target.closest('[data-url]');
    if (!row) return;
    navigator.clipboard?.writeText(row.dataset.url);
    row.style.outlineColor = '#d4000c';
    setTimeout(() => row.style.outlineColor = '', 400);
  };
</script>
</body>
</html>
